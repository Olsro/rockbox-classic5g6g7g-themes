wps: /.rockbox/wps/iVideoPomme.wps
sbs: /.rockbox/wps/iVideoPomme.sbs
fms: /.rockbox/wps/iVideoPomme.fms
backdrop: /.rockbox/backdrops/iVideoPomme_Backdrop.bmp
background color: FFFFFF
filetype colours: -
# Official iPod Video menu face: regular Podium Sans 18 with CJK glyphs.
# A 24 px cell adds vertical breathing room and fills the 216 px menu viewport
# with exactly nine full-width selection rows.
font: /.rockbox/fonts/24-PodiumCJK18-a4.fnt
foreground color: 000000
# Blank icon slots reserve a small left margin without displaying icons.
iconset: /.rockbox/icons/ivideopomme_menupadding.bmp
line selector end color: 186DBD
line selector start color: 6BA6DE
line selector text color: FFFFFF
scrollbar: off
selector type: bar (gradient)
show icons: on
statusbar: off
ui viewport: 0,24,320,216,-,-,-
viewers iconset: -
